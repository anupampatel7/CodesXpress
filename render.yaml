services:
  - type: web
    name: codesxpress377
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_1
        value: "@OfferRaider"
      - key: CHANNEL_2
        value: "@OfferMate"
      - key: CHANNEL_3
        value: "@Grabmint"
      - key: CHANNEL_4
        value: "@offerelite"
      - key: WEBAPP_URL
        value: "https://codesxpress377.onrender.com"
      - key: WEBAPP_HOST
        value: "0.0.0.0"
      - key: WEBAPP_PORT
        value: "8080"
      - key: LOG_LEVEL
        value: "INFO"

databases:
  - name: codes-xpress-db
    region: oregon
    plan: free
