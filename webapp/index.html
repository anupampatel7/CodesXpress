<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Codes Xpress 💎 | Secure Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --card-bg: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--tg-theme-bg-color, var(--bg-primary));
      color: var(--tg-theme-text-color, var(--text-primary));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--tg-theme-text-color, var(--text-primary));
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--tg-theme-hint-color, var(--text-secondary));
    }

    /* Main Verification Card */
    .card {
      background: var(--tg-theme-secondary-bg-color, var(--card-bg));
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }

    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .icon-badge.success {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
    }

    .icon-badge.warning {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .icon-badge.error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
      color: var(--tg-theme-text-color, var(--text-primary));
    }

    .card-desc {
      font-size: 14px;
      color: var(--tg-theme-hint-color, var(--text-secondary));
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 290px;
    }

    /* Actions & Buttons */
    .btn {
      width: 100%;
      background: var(--tg-theme-button-color, var(--accent-blue));
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-blue-hover);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Status & Spinner */
    .status-area {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 22px;
    }

    .status-area.success { color: var(--accent-green); }
    .status-area.warning { color: var(--accent-amber); }
    .status-area.error { color: var(--accent-red); }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="brand-header">
      <div class="brand-title">Codes Xpress 💎</div>
      <div class="brand-subtitle">Secure Device Verification</div>
    </header>

    <main class="card" id="verifyCard">
      <div class="icon-badge" id="iconBadge">🔐</div>
      <h1 class="card-title" id="cardTitle">Verify Your Device</h1>
      <p class="card-desc" id="cardDesc">
        One Telegram account can participate from one verified device.
      </p>

      <button class="btn" id="verifyBtn" onclick="runDeviceVerification()">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Verify Device</span>
      </button>

      <div class="status-area" id="statusArea"></div>
    </main>

    <footer class="footer-note">
      🔒 256-bit encrypted verification • No personal data collected
    </footer>
  </div>

  <script>
    // Initialize Telegram WebApp SDK safely
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    // Cryptographically random persistent device installation ID
    function getOrCreateDeviceInstallationId() {
      const STORAGE_KEY = "codesxpress_device_installation_id";
      let deviceId = "";
      try {
        deviceId = localStorage.getItem(STORAGE_KEY) || "";
      } catch (e) {
        deviceId = "";
      }

      if (!deviceId || deviceId.length < 16) {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          deviceId = window.crypto.randomUUID();
        } else if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const arr = new Uint8Array(16);
          window.crypto.getRandomValues(arr);
          deviceId = Array.from(arr, byte => byte.toString(16).padStart(2, '0')).join('');
        } else {
          deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        }
        try {
          localStorage.setItem(STORAGE_KEY, deviceId);
        } catch (e) {}
      }
      return deviceId;
    }

    // Build privacy-conscious device fingerprint
    function generateBrowserFingerprint() {
      const deviceId = getOrCreateDeviceInstallationId();
      const screenDetails = `${window.screen.width}x${window.screen.height}@${window.devicePixelRatio || 1}`;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      const language = navigator.language || navigator.userLanguage || "en";
      const platform = navigator.platform || "unknown";
      const hardwareConcurrency = String(navigator.hardwareConcurrency || 4);

      let canvasHash = "";
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 120;
        canvas.height = 30;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60";
        ctx.fillRect(10, 1, 62, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("CodesXpress", 2, 8);
        canvasHash = canvas.toDataURL().slice(-32);
      } catch (e) {
        canvasHash = "canvas_unavailable";
      }

      return {
        device_id: deviceId,
        screen: screenDetails,
        timezone: timeZone,
        language: language,
        platform: platform,
        hardware_concurrency: hardwareConcurrency,
        canvas: canvasHash,
      };
    }

    async function runDeviceVerification() {
      const btn = document.getElementById("verifyBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const iconBadge = document.getElementById("iconBadge");
      const title = document.getElementById("cardTitle");
      const desc = document.getElementById("cardDesc");
      const statusArea = document.getElementById("statusArea");

      // UI: Loading State
      btn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.innerText = "Verifying your device…";
      statusArea.className = "status-area";
      statusArea.innerText = "Securing device identity…";

      const initData = tg?.initData || "";
      const fingerprint = generateBrowserFingerprint();

      try {
        const response = await fetch("/api/verify-device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            init_data: initData,
            fingerprint: fingerprint,
          }),
        });

        const result = await response.json();

        if (result.success) {
          // UI: Success State
          iconBadge.className = "icon-badge success";
          iconBadge.innerText = "✓";
          title.innerText = "Device Verified";
          desc.innerHTML = "Your device has been securely verified.<br>You can now return to Codes Xpress.";
          btn.style.display = "none";
          statusArea.className = "status-area success";
          statusArea.innerText = "Returning to Telegram…";

          // Send completion signal back to bot and close Mini App
          setTimeout(() => {
            if (tg && typeof tg.sendData === "function") {
              try {
                tg.sendData(JSON.stringify({ verified: true, code: result.code }));
              } catch (e) {}
            }
            setTimeout(() => {
              if (tg && typeof tg.close === "function") {
                try {
                  tg.close();
                } catch (e) {}
              }
            }, 600);
          }, 1000);

        } else if (result.code === "USER_ALREADY_BOUND_TO_ANOTHER_DEVICE") {
          // UI: Account already bound to different device
          iconBadge.className = "icon-badge warning";
          iconBadge.innerText = "⚠️";
          title.innerText = "Verification Unavailable";
          desc.innerText = "This Telegram account is already registered on another device.";
          btn.style.display = "none";
          statusArea.className = "status-area warning";
          statusArea.innerText = "Account already bound to another device.";

        } else if (result.code === "DEVICE_ALREADY_BOUND") {
          // UI: Device already bound to different account
          iconBadge.className = "icon-badge warning";
          iconBadge.innerText = "⚠️";
          title.innerText = "Verification Unavailable";
          desc.innerText = "This device has already been used for referral verification.";
          btn.style.display = "none";
          statusArea.className = "status-area warning";
          statusArea.innerText = "Device already bound to another account.";

        } else {
          // UI: General Error State with Retry
          iconBadge.className = "icon-badge error";
          iconBadge.innerText = "✕";
          title.innerText = "Verification failed";
          desc.innerText = result.message || "Please check your connection and try again.";
          btn.disabled = false;
          btnSpinner.style.display = "none";
          btnText.innerText = "Try Again";
          statusArea.className = "status-area error";
          statusArea.innerText = "Verification rejected.";
        }
      } catch (err) {
        // UI: Network Error State
        iconBadge.className = "icon-badge error";
        iconBadge.innerText = "✕";
        title.innerText = "Verification failed";
        desc.innerText = "Network request failed. Please check your connection.";
        btn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.innerText = "Try Again";
        statusArea.className = "status-area error";
        statusArea.innerText = "Network connection error.";
      }
    }
  </script>
</body>
</html>
