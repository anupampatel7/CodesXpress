<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Codes Xpress 💎 | Secure Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%, #090d16 100%);
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-glow: rgba(59, 130, 246, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --accent-blue-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.12);
      --accent-green-border: rgba(16, 185, 129, 0.3);
      --accent-amber: #f59e0b;
      --accent-amber-bg: rgba(245, 158, 11, 0.12);
      --accent-amber-border: rgba(245, 158, 11, 0.3);
      --accent-red: #ef4444;
      --accent-red-bg: rgba(239, 68, 68, 0.12);
      --accent-red-border: rgba(239, 68, 68, 0.3);
      --radius-card: 22px;
      --radius-btn: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--tg-theme-bg-color, var(--bg-gradient));
      background-attachment: fixed;
      color: var(--tg-theme-text-color, var(--text-primary));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(59, 130, 246, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Brand Pill Header */
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 100px;
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #93c5fd;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
    }

    /* Main Verification Card */
    .card {
      background: var(--tg-theme-secondary-bg-color, var(--card-bg));
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 34px 24px 28px 24px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 40px -10px var(--card-glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Interactive Icon Badge with Floating Glow */
    .icon-badge {
      width: 74px;
      height: 74px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.05) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .icon-badge::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
      z-index: -1;
      opacity: 0.8;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .icon-badge.success {
      background: linear-gradient(135deg, var(--accent-green-bg) 0%, rgba(16, 185, 129, 0.05) 100%);
      border-color: var(--accent-green-border);
      color: var(--accent-green);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .icon-badge.warning {
      background: linear-gradient(135deg, var(--accent-amber-bg) 0%, rgba(245, 158, 11, 0.05) 100%);
      border-color: var(--accent-amber-border);
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3);
      animation: shake 0.4s ease;
    }

    .icon-badge.error {
      background: linear-gradient(135deg, var(--accent-red-bg) 0%, rgba(239, 68, 68, 0.05) 100%);
      border-color: var(--accent-red-border);
      box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.3);
      animation: shake 0.4s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
      color: var(--tg-theme-text-color, var(--text-primary));
    }

    .card-desc {
      font-size: 14px;
      color: var(--tg-theme-hint-color, var(--text-secondary));
      line-height: 1.55;
      margin-bottom: 24px;
      max-width: 300px;
    }

    /* Trust Highlights Pill */
    .trust-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
      width: 100%;
    }

    .trust-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    /* Action Button */
    .btn {
      width: 100%;
      background: var(--tg-theme-button-color, var(--accent-blue-gradient));
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: var(--radius-btn);
      padding: 15px 20px;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--accent-blue-shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -4px rgba(59, 130, 246, 0.5);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Area */
    .status-area {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 22px;
      transition: all 0.3s ease;
    }

    .status-area.success { color: var(--accent-green); }
    .status-area.warning { color: var(--accent-amber); }
    .status-area.error { color: var(--accent-red); }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer / Security Note */
    .footer-note {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0.85;
      letter-spacing: 0.1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="brand-header">
      <div class="brand-dot"></div>
      <div class="brand-title">Codes Xpress 💎</div>
    </header>

    <main class="card" id="verifyCard">
      <div class="icon-badge" id="iconBadge">🔐</div>
      <h1 class="card-title" id="cardTitle">Verify Your Device</h1>
      <p class="card-desc" id="cardDesc">
        One Telegram account can participate from one verified device.
      </p>

      <div class="trust-pills">
        <div class="trust-pill">⚡ 1 Device = 1 User</div>
        <div class="trust-pill">🛡️ Anti-Fraud</div>
      </div>

      <button class="btn" id="verifyBtn" onclick="runDeviceVerification()">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Verify Device</span>
      </button>

      <div class="status-area" id="statusArea"></div>
    </main>

    <footer class="footer-note">
      🔒 256-bit encrypted verification • No personal data collected
    </footer>
  </div>

  <script>
    // Initialize Telegram WebApp SDK safely
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    // Cryptographically random persistent device installation ID
    function getOrCreateDeviceInstallationId() {
      const STORAGE_KEY = "codesxpress_device_installation_id";
      let deviceId = "";
      try {
        deviceId = localStorage.getItem(STORAGE_KEY) || "";
      } catch (e) {
        deviceId = "";
      }

      if (!deviceId || deviceId.length < 16) {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          deviceId = window.crypto.randomUUID();
        } else if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const arr = new Uint8Array(16);
          window.crypto.getRandomValues(arr);
          deviceId = Array.from(arr, byte => byte.toString(16).padStart(2, '0')).join('');
        } else {
          deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        }
        try {
          localStorage.setItem(STORAGE_KEY, deviceId);
        } catch (e) {}
      }
      return deviceId;
    }

    // Build privacy-conscious device fingerprint
    function generateBrowserFingerprint() {
      const deviceId = getOrCreateDeviceInstallationId();
      const screenDetails = `${window.screen.width}x${window.screen.height}@${window.devicePixelRatio || 1}`;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      const language = navigator.language || navigator.userLanguage || "en";
      const platform = navigator.platform || "unknown";
      const hardwareConcurrency = String(navigator.hardwareConcurrency || 4);

      let canvasHash = "";
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 120;
        canvas.height = 30;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60";
        ctx.fillRect(10, 1, 62, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("CodesXpress", 2, 8);
        canvasHash = canvas.toDataURL().slice(-32);
      } catch (e) {
        canvasHash = "canvas_unavailable";
      }

      return {
        device_id: deviceId,
        screen: screenDetails,
        timezone: timeZone,
        language: language,
        platform: platform,
        hardware_concurrency: hardwareConcurrency,
        canvas: canvasHash,
      };
    }

    async function runDeviceVerification() {
      const btn = document.getElementById("verifyBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const iconBadge = document.getElementById("iconBadge");
      const title = document.getElementById("cardTitle");
      const desc = document.getElementById("cardDesc");
      const statusArea = document.getElementById("statusArea");

      // UI: Loading State
      btn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.innerText = "Verifying your device…";
      statusArea.className = "status-area";
      statusArea.innerText = "Securing device identity…";

      const initData = tg?.initData || "";
      const fingerprint = generateBrowserFingerprint();

      try {
        const response = await fetch("/api/verify-device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            init_data: initData,
            fingerprint: fingerprint,
          }),
        });

        const result = await response.json();

        if (result.success) {
          // UI: Success State
          iconBadge.className = "icon-badge success";
          iconBadge.innerText = "✓";
          title.innerText = "Device Verified";
          desc.innerHTML = "Your device has been securely verified.<br>You can now return to Codes Xpress.";
          btn.style.display = "none";
          statusArea.className = "status-area success";
          statusArea.innerText = "Returning to Telegram…";

          // Send completion signal back to bot and close Mini App
          setTimeout(() => {
            if (tg && typeof tg.sendData === "function") {
              try {
                tg.sendData(JSON.stringify({ verified: true, code: result.code }));
              } catch (e) {}
            }
            setTimeout(() => {
              if (tg && typeof tg.close === "function") {
                try {
                  tg.close();
                } catch (e) {}
              }
            }, 600);
          }, 1000);

        } else if (result.code === "USER_ALREADY_BOUND_TO_ANOTHER_DEVICE") {
          // UI: Account already bound to different device
          iconBadge.className = "icon-badge warning";
          iconBadge.innerText = "⚠️";
          title.innerText = "Verification Unavailable";
          desc.innerText = "This Telegram account is already registered on another device.";
          btn.style.display = "none";
          statusArea.className = "status-area warning";
          statusArea.innerText = "Account already bound to another device.";

        } else if (result.code === "DEVICE_ALREADY_BOUND") {
          // UI: Device already bound to different account
          iconBadge.className = "icon-badge warning";
          iconBadge.innerText = "⚠️";
          title.innerText = "Verification Unavailable";
          desc.innerText = "This device has already been used for referral verification.";
          btn.style.display = "none";
          statusArea.className = "status-area warning";
          statusArea.innerText = "Device already bound to another account.";

        } else {
          // UI: General Error State with Retry
          iconBadge.className = "icon-badge error";
          iconBadge.innerText = "✕";
          title.innerText = "Verification failed";
          desc.innerText = result.message || "Please check your connection and try again.";
          btn.disabled = false;
          btnSpinner.style.display = "none";
          btnText.innerText = "Try Again";
          statusArea.className = "status-area error";
          statusArea.innerText = "Verification rejected.";
        }
      } catch (err) {
        // UI: Network Error State
        iconBadge.className = "icon-badge error";
        iconBadge.innerText = "✕";
        title.innerText = "Verification failed";
        desc.innerText = "Network request failed. Please check your connection.";
        btn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.innerText = "Try Again";
        statusArea.className = "status-area error";
        statusArea.innerText = "Network connection error.";
      }
    }
  </script>
</body>
</html>
